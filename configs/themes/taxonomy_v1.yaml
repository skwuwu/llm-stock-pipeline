    axis: cyclical
    definition: >
      패널 업체의 설비투자 사이클과 세트 출하량에 연동되는 디스플레이 장비·부품 종목.
    inclusion: >
      패널 제조·검사 장비, FPCB, 구동회로 실장(PBA·COF), 편광·광학 필름, 백라이트
    exclusion: >
      반도체 전·후공정용 장비·소재는 semi_materials_parts (같은 고객사라도 공정이 다르다).
      패널 자체를 생산하는 세트업체는 제외.
    keywords: [OLED, LCD, 디스플레이, 패널, FPCB, 검사장비, 증착, 편광, COF, 백라이트, PBA]
    allowed_sectors: [ELECTRONIC_COMP, MACHINERY, SEMI, CHEM]
    core_revenue_share_min: 0.40

  - id: advertising_marketing
    name_ko: 광고·마케팅
    derivation: llm
    axis: cyclical
    definition: 광고주의 집행 예산에 실적이 연동되는 광고대행·마케팅 종목.
    inclusion: 종합광고대행, 디지털 광고, 미디어렙, 옥외광고, 마케팅 솔루션
    exclusion: >
      드라마·영화·음악 등 콘텐츠 IP 를 직접 제작·보유하면 media_content_ip.
    keywords: [광고, 광고대행, 미디어렙, 디지털광고, 캠페인, 마케팅, 매체, 옥외광고]
    allowed_sectors: [MEDIA_ENT, BUSINESS_SVC, IT_SERVICES]
    core_revenue_share_min: 0.40

  - id: rental_leasing
    name_ko: 렌탈·리스
    derivation: llm
    axis: structural
    definition: 자산을 직접 보유해 임대료로 반복 수익을 내는 렌탈·리스 종목.
    inclusion: 산업장비·파렛트·IT기기 렌탈, 생활가전 렌탈, 차량 렌트, 운용리스
    exclusion: >
      부동산 임대는 제외.
      자산을 보유하지 않고 금융만 제공하는 금융리스는 각 금융 테마로.
    keywords: [렌탈, 리스, 임대, 파렛트, 고소장비, 렌터카, 정수기, 운용리스]
    allowed_sectors: [MACHINERY, BUSINESS_SVC, TRADING_DISTRIB, OTHER_FIN]
    core_revenue_share_min: 0.40

  - id: net_cash_asset_play
    name_ko: 순현금·자산주
    derivation: quantitative      # net_cash / market_cap 임계로 판정
    axis: structural
    definition: 순현금 또는 투자부동산·유가증권 등 비영업자산 가치가 시총 대비 과도한 종목.
    inclusion: 순현금 / 시총 임계 초과, 또는 비영업자산 장부가 / 시총 임계 초과
    exclusion: 금융업(은행·증권·보험)은 순현금 개념이 성립하지 않아 제외
    keywords: []
    allowed_sectors: NOT [BANK, SECURITIES, INSURANCE, OTHER_FIN]
    core_revenue_share_min: null

  - id: telecom_utility_yield
    name_ko: 통신·유틸리티 배당
    derivation: llm
    axis: structural
    definition: 규제 산업 내 안정적 현금흐름을 바탕으로 한 고배당 통신·유틸리티 종목.
    inclusion: 이동통신, 전력·가스 공급, 지역난방
    exclusion: 요금 규제로 적자 구조가 고착된 경우 데이터 품질 플래그와 함께 검토
    keywords: [통신, 이동통신, ARPU, 전력, 가스, 지역난방, 요금규제, 배당]
    allowed_sectors: [TELECOM, UTILITIES]
    core_revenue_share_min: 0.50

  # ── v1.2 추가: 복수 종목 공백 (2026-08-08) ─────────────────────────
  # GARP/Quality FCF 스크린 최초 실행에서 기권 15종목이 나왔고, 그중 8종목이
  # 아래 세 칸이 없어서 발생했다. **LLM 오작동이 아니었다** — 억지로 끼워맞추지
  # 않고 기권한 것이라, 채워야 할 것은 프롬프트가 아니라 사전이다.
  # 단일 종목만 해당하는 공백(수공구, 택스리펀드, 부동산 권리조사 등)은
  # 만들지 않는다. 그 종목이 다음 리밸런스에서 빠지면 죽은 테마가 된다.

  - id: memory_semiconductor
    name_ko: 메모리 반도체
    derivation: llm
    axis: cyclical
    definition: DRAM·NAND 등 메모리 반도체를 직접 설계 또는 제조하여 판매하는 종목.
    # 이 칸이 없어서 SK하이닉스·삼성전자가 동시에 기권했다. semi_materials_parts
    # 는 '공급하는' 종목이고 제외 조항이 칩메이커를 막고 있어, 칩을 만드는 회사가
    # 들어갈 자리가 아예 없었다.
    inclusion: >
      DRAM·NAND·MCP·이미지센서 등 메모리/시스템 반도체 칩의 직접 설계 또는
      웨이퍼 제조. 팹리스로 설계만 하고 파운드리에 위탁하는 경우도 포함한다
      (제주반도체) — 판단 기준은 팹 보유가 아니라 **칩 자체를 팔았는가**다.
    exclusion: >
      장비·소재·부품 공급은 semi_materials_parts. HBM 본딩·인터포저 등 첨단
      패키징 공정 장비·소재는 hbm_advanced_packaging. SiC·전력반도체는
      power_semiconductor. 메모리 모듈을 사다 조립·유통만 하면 제외.
      후공정 외주(OSAT)만 수행하는 경우도 칩을 판 것이 아니므로 제외.
    keywords: [DRAM, NAND, 메모리, 낸드, 플래시, D램, MCP, 웨이퍼, 팹, 파운드리, 시스템반도체, 이미지센서]
    # 삼성전자는 ELECTRONIC_COMP 로 분류돼 있다. SEMI 만 두면 sector_conflict 가
    # 뜬다 — 실제로는 섹터 매핑의 한계이지 분류 오류가 아니다.
    allowed_sectors: [SEMI, ELECTRONIC_COMP]
    # 0.3 으로 두는 이유: 삼성전자 DS 부문은 매출 비중이 40% 안팎이라
    # 0.5 를 걸면 배정되지 않는다. 손익 기여는 그보다 훨씬 크다.
    core_revenue_share_min: 0.3

  - id: credit_rating_data
    name_ko: 신용평가·기업정보
    derivation: llm
    axis: structural
    definition: 신용평가·신용정보 조회·기업정보 DB·금융데이터 단말을 제공하는 종목.
    inclusion: >
      기업/개인 신용평가 및 신용정보 조회, 기업정보 DB 구독, 금융데이터 단말·
      리서치 정보 판매, 자산실사·권리조사 등 정보 검증 용역
    exclusion: >
      시스템 구축·운영이 주력이면 it_services_si. 결제·정산·VAN 은
      payments_fintech. 증권 위탁매매 수수료가 주력이면 securities_brokerage.
    keywords: [신용평가, 신용정보, CB, 기업정보, 데이터베이스, 금융정보, 단말, 리서치, 실사, 권리조사]
    allowed_sectors: [IT_SERVICES, SECURITIES, OTHER_FIN, BUSINESS_SVC]
    core_revenue_share_min: 0.4

  - id: renewable_power_gen
    name_ko: 신재생 발전
    derivation: llm
    axis: secular
    definition: 태양광·풍력 등 재생에너지 설비를 제조하거나 발전단지를 개발·운영하는 종목.
    inclusion: >
      태양광 셀·모듈·인버터 제조, 풍력 타워·블레이드 제조, 재생에너지 발전단지
      개발·EPC·O&M, 자체 발전 매출(PPA·REC 판매)
    exclusion: >
      원전·SMR 은 nuclear_smr. 송배전 기자재(변압기·케이블)는 power_cable_grid
      또는 ai_datacenter_power. ESS 배터리 셀·소재는 ev_battery_materials.
      재생에너지 현장의 단순 토목 시공만 수행하면 construction_materials.
    keywords: [태양광, 셀, 모듈, 인버터, 풍력, 블레이드, 타워, REC, PPA, 재생에너지, 발전단지, 신재생]
    # HD현대에너지솔루션은 태양광 셀 공정이 반도체와 겹쳐 SEMI 로 분류돼 있고,
    # 대명에너지는 발전단지 개발이 주력이라 CONSTRUCTION 이다. 둘 다 정상이다.
    allowed_sectors: [SEMI, CONSTRUCTION, ELEC_EQUIP, MACHINERY, UTILITIES, ENERGY]
    core_revenue_share_min: 0.4
