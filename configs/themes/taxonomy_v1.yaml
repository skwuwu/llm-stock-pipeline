  # ── 2026-08-07 신설: 기권 18종목을 수용하기 위한 테마 ──
  # 기존 사전이 제조·소재 중심이라 물류·유통·서비스 업종에 칸이 없었다.
  # LLM 기권 25건의 상당수는 오류가 아니라 사전 공백이었다.

  - id: logistics_3pl
    name_ko: 물류·택배
    derivation: llm
    axis: cyclical
    definition: 화물 취급 물량과 단가에 실적이 연동되는 계약물류·택배·포워딩 종목.
    inclusion: 3PL(계약물류), 택배, 국제 포워딩, 창고·보관, 내륙운송
    exclusion: >
      선박을 보유·용선해 직접 운항하면 shipping_freight.
      포워더는 운임 상승이 매입원가 상승이라 선사와 손익 방향이 반대다 — 여기로 온다.
    keywords: [3PL, 택배, 포워딩, 계약물류, 창고, 보관, 통관, 내륙운송, 물류센터]
    allowed_sectors: [TRANSPORT_LOGISTICS, TRADING_DISTRIB]
    core_revenue_share_min: 0.30

