# 투자 테마 사전 v1 — LLM은 이 사전에서만 테마를 고를 수 있다.
# 신규 테마는 proposed_new_theme 로 제안만 가능하고, 사람이 승인해야 v2에 편입된다.
#
# 필드 규약
#   id                     : snake_case, 불변. 성과 시계열의 조인 키.
#   derivation             : llm | quantitative
#                            quantitative = 재무지표로 결정론적 판정, LLM에 묻지 않는다.
#   axis                   : structural(구조·정책) | cyclical(경기) | secular(구조적 성장)
#   definition             : LLM이 읽는 판별 기준. "무엇이 이 테마인가"를 배타적으로 서술.
#   inclusion / exclusion  : 경계 사례. exclusion이 테마 편승 오탐을 막는 핵심 필드.
#   keywords               : Stage-0 무료 사전필터용. 재현율 우선(정밀도는 LLM이 담당).
#   allowed_sectors        : V2 섹터 정합성 검증용. 여기 없으면 sector_conflict 플래그.
#   core_revenue_share_min : V3 세그먼트 검증용. 실제 매출 비중이 이 미만이면 core 불가.
version: "1.2.0"
market_scope: [KR, JP]

themes:

  # ── 정책 · 거버넌스 ────────────────────────────────────────────
  - id: value_up_governance
    name_ko: 밸류업·주주환원
    derivation: llm
    axis: structural
    definition: >
      기업가치 제고 계획 공시, 배당 확대·자사주 매입/소각 등 자본배치 정책 변화로
      할인 해소가 기대되는 종목.
    inclusion: 기업가치제고계획 공시, 배당성향 상향 발표, 자사주 소각 결의
    exclusion: >
      단순히 배당수익률이 높기만 한 종목은 제외. 정책 '변화'의 근거 공시가 있어야 한다.
      과거 배당 이력만으로 배정 금지.
    keywords: [기업가치제고, 밸류업, 자사주, 소각, 배당성향, 주주환원, 자본효율, ROE제고]
    allowed_sectors: ANY
    core_revenue_share_min: null   # 재무정책 테마 — 매출 비중 무관

  - id: holdco_discount
    name_ko: 지주사 할인
    derivation: quantitative      # is_holding 플래그 + NAV 괴리로 판정
    axis: structural
    definition: 순자산가치 대비 과도한 할인 상태의 지주회사.
    inclusion: 지주회사 요건 충족 + 자회사 지분가치 합 대비 시총 할인율 임계 초과
    exclusion: 사업지주회사 중 자체 영업이익 비중이 큰 경우는 사업 테마로 분류
    keywords: []
    allowed_sectors: [HOLDING]
    core_revenue_share_min: null

  - id: activist_target
    name_ko: 행동주의·경영권
    derivation: llm
    axis: structural
    definition: 행동주의 펀드 지분 공시, 주주제안, 경영권 분쟁이 진행 중인 종목.
    inclusion: 5%룰 대량보유 보고(경영참가 목적), 주주제안 접수, 위임장 경쟁
    exclusion: 단순투자 목적 지분 취득은 제외
    keywords: [주주제안, 경영참가, 대량보유, 위임장, 행동주의, 지분경쟁]
    allowed_sectors: ANY
    core_revenue_share_min: null

  # ── AI · 전력 ──────────────────────────────────────────────────
  - id: ai_datacenter_power
    name_ko: AI 데이터센터 전력기기
    derivation: llm
    axis: secular
    definition: >
      AI 데이터센터 및 전력망 증설에 따른 초고압 변압기, 차단기, GIS, 배전반 등
      중전기기 수요 증가의 수혜 종목.
    inclusion: 초고압 변압기·GIS·차단기 제조, 북미/중동 전력청향 수주 공시
    exclusion: >
      데이터센터·전력망향 매출 언급 없이 일반 산업용 저압 배전반만 생산하는 경우 제외.
      단순 전기공사·시공은 제외.
    keywords: [변압기, 초고압, 차단기, GIS, 배전반, 개폐기, 전력기기, 중전기, 데이터센터]
    allowed_sectors: [ELEC_EQUIP, MACHINERY, ELECTRONIC_COMP, CONSTRUCTION]
    core_revenue_share_min: 0.20

  - id: power_cable_grid
    name_ko: 전력망·전선
    derivation: llm
    axis: secular
    definition: 송배전망 확충 및 해저케이블 수요에 따른 전선·케이블·소재 종목.
    # AMI·배전자동화를 포함하는 이유: 전력량계·원격검침은 송배전망 투자 예산에서
    # 집행되는 같은 사이클이다. 별도 테마로 쪼개면 표본이 흩어져 판정만 어려워진다.
    inclusion: 초고압 케이블, 해저케이블, 절연소재, 동복강선 제조, 전력량계·AMI·배전자동화
    exclusion: >
      통신용 광케이블만 생산하는 경우는 telecom 계열로 분류.
      데이터센터·발전소용 중전기기(변압기·GIS)가 주력이면 ai_datacenter_power.
    keywords: [전선, 케이블, 해저케이블, 송전, 배전, 절연, 전력망, 가공선]
    allowed_sectors: [ELEC_EQUIP, STEEL_METAL, CHEM, ELECTRONIC_COMP]
    core_revenue_share_min: 0.20

  - id: semi_materials_parts
    name_ko: 반도체 소재·부품·장비
    derivation: llm
    axis: secular
    definition: 반도체 전공정·후공정용 소재, 부품, 장비를 공급하는 종목.
    inclusion: 식각·증착 장비, CMP 슬러리, 포토레지스트, 석영/세라믹 부품, 테스트 소켓
    exclusion: >
      반도체 고객사가 있다는 사실만으로 배정 금지 — 단순 임가공, 범용 기계부품 납품은 제외.
      반도체 전용 매출 비중이 확인되어야 한다.
      **칩 자체를 설계·제조해 파는 종목은 memory_semiconductor 다** — 이쪽은
      그 칩을 만드는 데 쓰이는 것을 공급하는 종목이다.
    keywords: [반도체, 웨이퍼, 식각, 증착, CMP, 포토레지스트, 전공정, 후공정, 소재, 장비, 파츠]
    allowed_sectors: [SEMI, ELECTRONIC_COMP, CHEM, MACHINERY, NONMETAL_MIN]
    core_revenue_share_min: 0.30

  - id: hbm_advanced_packaging
    name_ko: HBM·첨단 패키징
    derivation: llm
    axis: secular
    definition: HBM, 2.5D/3D 패키징, TC 본더, TSV 등 첨단 패키징 밸류체인 종목.
    inclusion: TC본더, 하이브리드 본딩, 인터포저, 언더필, 리드프레임 중 HBM향
    exclusion: >
      범용 DRAM/NAND 패키징만 수행하는 경우는 semi_materials_parts로 분류.
      HBM 을 탑재한 메모리 칩 자체를 만들어 파는 종목은 memory_semiconductor 다
      — 이 테마는 그 패키징에 쓰이는 장비·소재 공급자를 가리킨다.
    keywords: [HBM, 패키징, TSV, 본더, 인터포저, 하이브리드본딩, 언더필, 2.5D, 3D적층]
    allowed_sectors: [SEMI, ELECTRONIC_COMP, MACHINERY, CHEM]
    core_revenue_share_min: 0.20

  - id: power_semiconductor
    name_ko: 전력반도체
    derivation: llm
    axis: secular
    definition: SiC/GaN 등 전력반도체 및 전력변환 모듈 관련 종목.
    inclusion: SiC 웨이퍼·에피, 전력반도체 패키징, 인버터/컨버터 모듈
    exclusion: 일반 아날로그 IC, 범용 다이오드만 생산하는 경우 제외
    keywords: [전력반도체, SiC, GaN, 인버터, 컨버터, IGBT, 에피, 전력변환]
    allowed_sectors: [SEMI, ELECTRONIC_COMP, ELEC_EQUIP]
    core_revenue_share_min: 0.20

  - id: datacenter_cooling
    name_ko: 데이터센터 냉각·인프라
    derivation: llm
    axis: secular
    definition: 데이터센터 액침·수랭 냉각, 항온항습, UPS 등 인프라 설비 종목.
    inclusion: 액침냉각, CDU, 항온항습기, 데이터센터향 UPS·수배전
    exclusion: 일반 건물용 공조(HVAC)만 취급하는 경우 제외
    keywords: [냉각, 액침, 수랭, 항온항습, UPS, CDU, 공조, 데이터센터]
    allowed_sectors: [MACHINERY, ELEC_EQUIP, ELECTRONIC_COMP, CONSTRUCTION]
    core_revenue_share_min: 0.15

  # ── 산업 사이클 ────────────────────────────────────────────────
  - id: shipbuilding_marine
    name_ko: 조선·조선기자재
    derivation: llm
    axis: cyclical
    definition: 선박 건조 및 조선 기자재(엔진, 밸브, 배관, 도료 등) 공급 종목.
    inclusion: LNG선·컨테이너선 건조, 선박용 엔진·프로펠러·밸브·평형수 설비
    exclusion: 육상 플랜트용 밸브·배관만 공급하면 plant_epc_overseas로 분류
    keywords: [조선, 선박, LNG선, 기자재, 선박엔진, 프로펠러, 평형수, 도크, 수주잔고]
    allowed_sectors: [SHIPBUILD, MACHINERY, STEEL_METAL, CHEM, AUTO]
    core_revenue_share_min: 0.25

  - id: shipping_freight
    name_ko: 해운·물류 운임
    derivation: llm
    axis: cyclical
    definition: 컨테이너·벌크·탱커 운임 사이클에 실적이 연동되는 해운·물류 종목.
    inclusion: 정기선/부정기선 운영, 유조선, 항만 하역
    exclusion: >
      내륙 육상운송·택배·3PL·포워딩은 logistics_3pl 로 분류한다.
      **선박을 보유·용선해 직접 운항하는 운송인(선사)만 해당한다.** 포워딩·주선업은
      운임이 오를 때 선사와 손익 방향이 반대라(매입원가 상승) 같은 사이클로 볼 수
      없으므로, 해상 화물을 취급한다는 서술만으로 배정하지 말 것.
    keywords: [해운, 운임, 컨테이너, 벌크, 탱커, BDI, SCFI, 용선, 항만]
    allowed_sectors: [TRANSPORT_LOGISTICS]
    core_revenue_share_min: 0.30

  - id: steel_nonferrous
    name_ko: 철강·비철 사이클
    derivation: llm
    axis: cyclical
    definition: 철강·비철금속 가격 및 스프레드 사이클에 연동되는 종목.
    inclusion: 고로/전기로 제강, 압연, 동·알루미늄·아연 제련
    exclusion: 금속 단순 유통·가공만 하는 경우는 마진 구조가 달라 제외
    keywords: [철강, 열연, 냉연, 후판, 전기로, 제련, 동, 알루미늄, 아연, 스프레드]
    allowed_sectors: [STEEL_METAL]
    core_revenue_share_min: 0.40

  - id: chemical_refining
    name_ko: 화학·정유 사이클
    derivation: llm
    axis: cyclical
    definition: 정제마진 또는 석유화학 스프레드 사이클에 연동되는 종목.
    inclusion: 원유 정제, NCC, 기초유분, 합성수지, 정밀화학
    exclusion: 2차전지 소재가 주력이면 ev_battery_materials로 분류
    keywords: [정유, 정제마진, NCC, 에틸렌, 프로필렌, 스프레드, 합성수지, 유분, 나프타]
    allowed_sectors: [CHEM, ENERGY]
    core_revenue_share_min: 0.40

  - id: construction_materials
    name_ko: 건설·건자재
    derivation: llm
    axis: cyclical
    definition: 주택·인프라 착공 사이클에 연동되는 건설사 및 건자재 종목.
    inclusion: 주택 시공, 시멘트, 레미콘, 철근, 창호, 단열재
    exclusion: 해외 플랜트 EPC 비중이 크면 plant_epc_overseas로 분류
    keywords: [건설, 시공, 분양, 시멘트, 레미콘, 철근, 창호, 단열재, 착공, 수주]
    allowed_sectors: [CONSTRUCTION, NONMETAL_MIN, STEEL_METAL, CHEM]
    core_revenue_share_min: 0.30

  - id: industrial_machinery
    name_ko: 산업기계·공작기계
    derivation: llm
    axis: cyclical
    definition: 설비투자 사이클에 연동되는 공작기계·건설기계·산업설비 종목.
    inclusion: 머시닝센터, 굴착기, 지게차, 산업용 로봇, 감속기
    exclusion: 반도체 전용 장비는 semi_materials_parts로 분류
    keywords: [공작기계, 건설기계, 굴착기, 지게차, 로봇, 감속기, 머시닝, 설비투자]
    allowed_sectors: [MACHINERY, ELEC_EQUIP]
    core_revenue_share_min: 0.30

  # ── 방산 · 원전 · 인프라 수출 ──────────────────────────────────
  - id: defense_export
    name_ko: 방산 수출
    derivation: llm
    axis: secular
    definition: 무기체계 및 방산 부품의 해외 수출 확대 수혜 종목.
    inclusion: 자주포·전차·유도무기·군용기 완제품 및 핵심 부품, 정부간 계약(G2G) 수주
    exclusion: >
      내수 방위사업청 납품만 있고 수출 실적·수주잔고가 없으면 core 불가(adjacent).
      민수용 부품이 주력이면 제외.
    keywords: [방산, 방위산업, 자주포, 유도무기, 전차, 군용, 수출계약, 방위사업, G2G]
    allowed_sectors: [AEROSPACE_DEFENSE, MACHINERY, ELECTRONIC_COMP, CHEM, AUTO]
    core_revenue_share_min: 0.30

  - id: nuclear_smr
    name_ko: 원전·SMR
    derivation: llm
    axis: secular
    definition: 대형원전 및 소형모듈원자로(SMR) 밸류체인 종목.
    inclusion: 주기기(원자로·증기발생기), 원전 밸브·펌프, 계측제어, 해체·정비, SMR 설계
    exclusion: >
      원전 관련 단순 시공 인력 파견은 제외. 태양광·풍력 등 재생에너지 설비·
      발전단지는 renewable_power_gen — '무탄소 발전'으로 묶지 말 것.
    keywords: [원전, 원자력, SMR, 주기기, 증기발생기, 원자로, 핵연료, 계측제어, 해체]
    allowed_sectors: [MACHINERY, ELEC_EQUIP, CONSTRUCTION, STEEL_METAL, ELECTRONIC_COMP]
    core_revenue_share_min: 0.20

  - id: plant_epc_overseas
    name_ko: 해외 플랜트·EPC
    derivation: llm
    axis: cyclical
    definition: 중동·동남아 정유·석유화학·인프라 플랜트 EPC 수주 사이클 종목.
    inclusion: 해외 정유/가스 플랜트 EPC, 담수화, 대형 인프라 턴키
    exclusion: 국내 주택 시공이 주력이면 construction_materials로 분류
    keywords: [플랜트, EPC, 턴키, 중동, 담수, 정유플랜트, 해외수주, 수주잔고]
    allowed_sectors: [CONSTRUCTION, MACHINERY, ENERGY]
    core_revenue_share_min: 0.30

  # ── 모빌리티 ──────────────────────────────────────────────────
  - id: auto_parts
    name_ko: 자동차 부품
    derivation: llm
    axis: cyclical
    definition: 완성차 생산량 및 판가에 연동되는 내연·공용 부품 종목.
    inclusion: 파워트레인, 섀시, 내외장, 시트, 공조, 베어링
    exclusion: 전동화 전용 부품이 주력이면 auto_electrification으로 분류
    keywords: [자동차부품, 완성차, 파워트레인, 섀시, 내장재, 시트, 공조, 베어링, OEM]
