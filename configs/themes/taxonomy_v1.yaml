    derivation: llm
    axis: cyclical
    definition: LPG·LNG 를 수입·저장·유통하며 판가와 도입원가 스프레드로 수익을 내는 종목.
    inclusion: LPG 수입·충전·판매, 가스 트레이딩, 저장·터미널, 산업용 가스 공급
    exclusion: >
      요금이 규제되는 도시가스 소매가 주력이면 telecom_utility_yield.
      원유 정제·석유화학 제조는 chemical_refining.
    keywords: [LPG, 프로판, 부탄, 가스, 충전소, 수입, 저장, 터미널, 도입]
    allowed_sectors: [TRADING_DISTRIB, ENERGY, UTILITIES, CHEM]
    core_revenue_share_min: 0.40

