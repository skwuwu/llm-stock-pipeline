# KR High FCF Margin — 현금화 능력 최상위주
#
# 밸류에이션을 보지 않는다. 시가총액 대비 **실제로 손에 남는 현금**이
# 압도적인 기업만 본다. 회계이익은 추정과 배분의 산물이지만 FCF 는 그렇지 않다.
#
# 실측(2026-08-06, 시총 1,000억+): FCFY>=10% 233종목 → OPM>=15% 병행 시 30종목.
# 딥밸류와 5종목 겹친다(KSS해운, 광주신세계, 서부T&D 등) — GARP 과 달리
# 완전히 분리되지는 않는다. 현금창출력이 좋은데 싼 종목이 실제로 있기 때문이다.
# 겹치는 종목은 **두 가설이 동시에 성립하는** 경우라 오히려 강한 후보다.
#
# 왜 OPM 을 같이 거는가: FCF Yield 만 걸면 일회성 현금(자산매각, 운전자본
# 일시 축소, CAPEX 이연)이 만든 한 해짜리 고FCF 가 대량으로 들어온다.
# 영업이익률은 그 현금이 **영업에서 반복적으로** 나오는지를 가르는 축이다.
version: 1
name: High FCF Margin
market: KR

universe:
  exclude_flags:
    - capital_impairment
    - stale_financials
    - ttm_incomplete
    - is_spac
    - is_reit
    - is_preferred
    - admin_issue
    - audit_opinion_bad_admin
    - market_cap_implausible
    - pbr_implausible
    - price_dividend_inconsistent
    - market_cap_inconsistent
    # **negative_earnings 를 켜지 않는다.** 다른 두 스크린은 PER 을 쓰므로
    # 적자면 지표가 음수가 되어 필터가 뚫린다. 이 스크린은 PER·PBR 을
    # 게이트에도 랭킹에도 쓰지 않아 그 고장이 발생하지 않는다.
    # 그리고 손상차손·일회성 비용으로 순손실인데 영업현금은 멀쩡한 기업이야말로
    # 이 스크린이 찾으려는 대상이다 — 켜면 그 집합을 통째로 잃는다.
    # OPM >= 15% 게이트가 '영업은 흑자' 를 이미 보장한다.
  min_market_cap_krw: 50_000_000_000
  pending_guards:
    - suspended
    - fiscal_period_change

filters:
  - {metric: fcf_yield, direction: higher_better, loose: 0.05, tight: 0.12}
  - {metric: op_margin, direction: higher_better, loose: 0.08, tight: 0.20}
  # 밸류에이션 제약 없음 — 이 스크린의 정의다.
  - {metric: adtv_20d, direction: higher_better, loose: 100_000_000, tight: 500_000_000}

gate:
  mode: target_count
  target_count: 40
  tolerance: 5
  hard_cap: 60
  bisect_iterations: 40
  budget:
    enabled: false
    max_input_tokens: 600_000
    est_tokens_per_stock: 8_000
  hysteresis: 0.08

checks:
  # FCF 스크린의 핵심 위험은 **그 현금이 반복되지 않는 것**이다.
  - id: fcf_without_earnings
    polarity: risk
    risk_group: 현금창출
    enabled: true
    kind: soft_flag
    expr: fcf_yield - cfo_to_ni
    op: ">"
    threshold: 1.00
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: >
      FCF 수익률이 이익 대비 현금창출력보다 과도하게 앞선다 — 이익이 아니라
      운전자본·CAPEX 이연에서 나온 현금일 수 있다. 다음 해에 되돌아온다.

  - id: capex_starved
    polarity: risk
    risk_group: 현금창출
    enabled: true
    kind: soft_flag
    expr: capex_ppe_ttm / revenue_ttm
    op: "<"
    threshold: 0.005
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: >
      매출 대비 유형자산 투자가 0.5% 미만. FCF = 영업현금 − CAPEX 이므로
      투자를 멈추면 FCF 는 자동으로 좋아진다. **높은 FCF 가 실력인지
      투자 중단인지 가르는 체크다** — 이 스크린에서 가장 중요하다.

  - id: accrual_anomaly
    polarity: risk
    risk_group: 현금창출
    enabled: true
    kind: soft_flag
    metric: accrual_ratio
    op: ">"
    threshold: 0.10
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 이익이 현금을 앞선다. 발생액 품질 의심

  - id: revenue_shrinking
    polarity: risk
    risk_group: 성장지속
    enabled: true
    kind: soft_flag
    metric: rev_growth_fy
    op: "<"
    threshold: -0.05
    note: >
      매출이 5% 이상 줄었다. 현금은 잘 뽑아도 사업이 축소 중이면 그 현금은
      유한하다 — 청산가치에 가까워지는 것이지 성장이 아니다.

  - id: high_leverage
    polarity: risk
    risk_group: 재무구조
    enabled: true
    kind: soft_flag
    metric: debt_ratio
    op: ">"
    threshold: 2.00
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN, REAL_ESTATE]
    note: 부채비율 200% 초과. 창출한 현금이 주주가 아니라 채권자에게 간다

  - id: low_current_ratio
    polarity: risk
    risk_group: 재무구조
    enabled: true
    kind: soft_flag
    metric: current_ratio
    op: "<"
    threshold: 1.00
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 유동비율 100% 미만. 결측은 '통과'가 아니라 '계산 불가'로 집계된다

  - id: low_roic
    polarity: risk
    risk_group: 수익성
    enabled: true
    kind: soft_flag
    metric: roic
    op: "<"
    threshold: 0.05
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 투입자본 대비 수익성이 낮다

  - id: owner_stake_low
    polarity: risk
    risk_group: 지배구조
    enabled: true
    kind: soft_flag
    metric: owner_stake
    op: "<"
    threshold: 0.20
    requires_source: dart_hyslr_sttus
    note: 최대주주 및 특수관계인 합계 20% 미만

  # ── 현금이 주주에게 돌아오는가 ────────────────────────────────────
  # 이 스크린에서만 의미가 다르다: FCF 가 많은데 환원이 없으면 '언젠가'가
  # 아니라 '영영' 안 올 수도 있다. 그래서 가산 신호로 명시적으로 본다.
  - id: treasury_heavy
    polarity: positive
    enabled: true
    kind: soft_flag
    metric: treasury_ratio
    op: ">"
    threshold: 0.05
    exclude_sectors: []
    note: 자사주 5% 초과 — 창출한 현금이 주주에게 돌아온 흔적

  - id: high_dividend
    polarity: positive
    enabled: true
    kind: soft_flag
    metric: div_yield
    op: ">="
    threshold: 0.04
    requires_source: dart_alot_matter
    note: 배당수익률 4% 이상 — FCF 가 실제로 주주에게 분배되고 있다

  - id: dividend_uncovered
    polarity: risk
    risk_group: 배당지속
    enabled: true
    kind: soft_flag
    metric: dividend_fcf_cover
    op: "<"
    threshold: 1.00
    requires_source: dart_alot_matter
    note: >
      배당이 FCF 를 초과한다. FCF 스크린에서 이게 걸리면 특히 이상하다 —
      FCF 가 많다고 통과시켰는데 배당이 그보다 크다면 둘 중 하나가 틀렸다.

digest:
  max_risk_groups_for_body: 2

# 현금창출력 우선. PER·PBR 은 **의도적으로 넣지 않는다** — 넣는 순간
# 이 스크린은 딥밸류의 변종이 되고, 비싸지만 현금을 압도적으로 잘 버는
# 기업(이 스크린의 존재 이유)이 아래로 밀린다.
ranking:
  method: composite_z
  weights: {fcf_yield: 0.45, op_margin: 0.35, roic: 0.20}

soft_flags_report_only:
  - oneoff_profit_suspect
  - per_op_divergence
  - financial_sector
  - holding_company
  - earnings_volatility_high
  - cfs_missing_used_ofs
  - negative_earnings   # 배제하지 않는 대신 **반드시 보이게** 한다
  - turnaround
