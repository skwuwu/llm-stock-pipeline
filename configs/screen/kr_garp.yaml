# KR Quality & GARP — 합리적 가격의 성장주
#
# 딥밸류가 구조적으로 못 잡는 집합을 노린다. 실측(2026-08-06, 시총 1,000억+):
# 이 조건을 통과한 28종목 중 딥밸류 스크린과 겹치는 종목은 **0개**였다.
#   한국카본        ROE 16.4% / PER 12.5 / OPM 15.7%
#   HD현대마린엔진   ROE 35.9% / PER 10.7 / OPM 21.7%
#   원텍            ROE 20.6% / PER 13.9 / OPM 30.3%
# '싼 것'만 보는 스크린은 이들을 영영 보지 못한다.
#
# ⚠ 흑자전환은 이 스크린이 잡지 못한다 — 그리고 그게 맞다.
#   기저가 적자면 성장률이 정의되지 않는다(compute_growth 참조). GARP 는
#   '이미 잘 벌고 있는데 더 크는' 기업을 찾는 스크린이지, 턴어라운드 스크린이
#   아니다. 흑자전환은 metrics 의 turnaround 컬럼으로 따로 잡아 별도 트랙에서
#   다룰 것 — 여기에 억지로 끼워넣으면 두 가설이 섞여 결과를 해석할 수 없다.
version: 1
name: Quality & GARP
market: KR

universe:
  # 딥밸류와 동일하다 — 데이터 품질 가드는 투자 스타일과 무관하다.
  exclude_flags:
    - capital_impairment
    - negative_earnings        # PER 밴드가 양의 이익을 전제한다
    - stale_financials
    - ttm_incomplete
    - is_spac
    - is_reit
    - is_preferred
    - admin_issue
    - audit_opinion_bad_admin
    - market_cap_implausible
    - pbr_implausible
    - price_dividend_inconsistent
    - market_cap_inconsistent
  min_market_cap_krw: 50_000_000_000
  pending_guards:
    - suspended
    - fiscal_period_change

# ── 정량 필터 ────────────────────────────────────────────────────────
# PER 은 **밴드**다. 상한·하한 두 필터로 표현하며 둘 다 t 에 단조라
# 이분탐색이 그대로 성립한다(gate.FilterSpec.key 가 둘을 구분해 기록한다).
#
# 하한을 두는 이유: PER 5 인데 ROE 20% 라면 시장이 그 이익을 지속 불가로
# 보고 있다는 뜻이다. 그건 GARP 가 아니라 딥밸류(또는 함정)의 영역이고,
# 이미 kr_deep_value 가 검사한다. 두 스크린이 같은 종목을 두고 다투면
# '어느 가설로 산 것인가'를 사후에 말할 수 없게 된다.
filters:
  - {metric: roe, direction: higher_better, loose: 0.10, tight: 0.20}
  # 매출 성장은 FY 기준이다. TTM 대 TTM 은 원천에 2년 전 분기가 없어
  # 만들 수 없다 — 유효율 95.8%. 분기 성장은 growth_decelerating 이 감시한다.
  - {metric: rev_growth_fy, direction: higher_better, loose: 0.05, tight: 0.20}
  # 영업이익 성장 유효율은 74.7% 다. 나머지는 '성장이 없는' 게 아니라
  # **전년이 적자라 계산 불가**인 경우다. 결측은 탈락으로 처리되므로
  # 이 필터가 턴어라운드를 배제한다 — 위 ⚠ 참조. 의도된 배제다.
  - {metric: op_growth_fy, direction: higher_better, loose: 0.05, tight: 0.20}
  #
  # **밴드는 고정이다(loose == tight).** PER 10~25 는 종목 수를 맞추는 노브가
  # 아니라 '정상 밸류에이션'의 정의다. 보간 대상으로 두면 이분탐색이 목표
  # 개수를 맞추려고 밴드를 넓혀버린다 — 실측: target 40 에서 6.0~29.0 까지
  # 벌어져 스크린의 정체성이 사라졌다. 개수 조절은 ROE·성장률에 맡긴다.
  - {metric: per, direction: lower_better,  loose: 25.0, tight: 25.0, exclusive_zero: true}
  - {metric: per, direction: higher_better, loose: 10.0, tight: 10.0}
  # PBR 상한은 두지 않는다. ROE 20% 기업의 PBR 3 은 비싼 게 아니라 정상이다.
  # 실측: PBR<=3.0 을 걸면 28 → 11 로 반토막 나면서, 남는 건 결국
  # 저PBR 종목이라 딥밸류와 성격이 겹친다.
  - {metric: adtv_20d, direction: higher_better, loose: 100_000_000, tight: 500_000_000}

gate:
  mode: target_count
  target_count: 40
  tolerance: 5
  hard_cap: 60
  bisect_iterations: 40
  budget:
    enabled: false
    max_input_tokens: 600_000
    est_tokens_per_stock: 8_000
  hysteresis: 0.08

# ── 체크 ─────────────────────────────────────────────────────────────
# 재무 위험 체크는 딥밸류와 공유한다 — 위험은 스타일을 타지 않는다.
# 다만 GARP 에서는 무게중심이 다르다: 싸게 사서 생기는 함정(배당 트랩)보다
# **성장의 진위**(발생액 품질, 성장 둔화)가 핵심 위험이다.
checks:
  - id: accrual_anomaly
    polarity: risk
    risk_group: 현금창출
    enabled: true
    kind: soft_flag
    metric: accrual_ratio
    op: ">"
    threshold: 0.10
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: >
      이익이 현금을 앞선다. 고성장주에서 가장 흔한 함정이다 — 매출채권·재고를
      늘려 만든 성장은 성장이 아니다. 이 스크린에서는 최우선 경고다.

  - id: cfo_shortfall
    polarity: risk
    risk_group: 현금창출
    enabled: true
    kind: soft_flag
    metric: cfo_to_ni
    op: "<"
    threshold: 0.50
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 순이익의 절반도 현금으로 들어오지 않았다

  # ── 성장의 신선도 ─────────────────────────────────────────────────
  - id: growth_decelerating
    polarity: risk
    risk_group: 성장지속
    enabled: true
    kind: soft_flag
    expr: rev_growth_fy - rev_growth_q
    op: ">"
    threshold: 0.15
    note: >
      **게이트가 쓰는 FY 성장률은 최대 7개월 묵은 값이다.** 최근 분기 성장률이
      그보다 15%p 이상 낮으면, 게이트를 통과시킨 그 성장은 이미 식었을 수 있다.
      스크린을 통과했다는 사실 자체를 의심하게 만드는 유일한 체크다.

  - id: op_growth_decelerating
    polarity: risk
    risk_group: 성장지속
    enabled: true
    kind: soft_flag
    expr: op_growth_fy - op_growth_q
    op: ">"
    threshold: 0.30
    note: >
      영업이익 성장 둔화. 매출보다 임계를 느슨하게 둔 이유는 영업이익 성장률의
      변동폭이 훨씬 크기 때문이다(유니버스 p25 −0.33 / p75 +0.41).

  - id: thin_margin
    polarity: risk
    risk_group: 수익성
    enabled: true
    kind: soft_flag
    metric: op_margin
    op: "<"
    threshold: 0.05
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: >
      영업이익률 5% 미만. ROE 가 높은데 마진이 얇으면 수익성이 아니라
      레버리지나 자산 회전에서 나온 것이다 — 뒤집히기 쉽다.
      실측: 아이티센글로벌 ROE 39.9% 인데 OPM 3.3%.

  - id: high_leverage
    polarity: risk
    risk_group: 재무구조
    enabled: true
    kind: soft_flag
    metric: debt_ratio
    op: ">"
    threshold: 2.00
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN, REAL_ESTATE]
    note: >
      부채비율 200% 초과. 고ROE 의 출처가 레버리지인지 가른다 —
      thin_margin 과 같이 걸리면 ROE 를 액면 그대로 믿으면 안 된다.

  - id: low_current_ratio
    polarity: risk
    risk_group: 재무구조
    enabled: true
    kind: soft_flag
    metric: current_ratio
    op: "<"
    threshold: 1.00
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 유동비율 100% 미만. 결측은 '통과'가 아니라 '계산 불가'로 집계된다

  - id: owner_stake_low
    polarity: risk
    risk_group: 지배구조
    enabled: true
    kind: soft_flag
    metric: owner_stake
    op: "<"
    threshold: 0.20
    requires_source: dart_hyslr_sttus
    note: 최대주주 및 특수관계인 합계 20% 미만 — 경영권 방어가 취약하다

  - id: treasury_heavy
    polarity: positive
    enabled: true
    kind: soft_flag
    metric: treasury_ratio
    op: ">"
    threshold: 0.05
    exclude_sectors: []
    note: 자사주 5% 초과 보유 — 소각 시 주주가치 상승 여지(가산 신호)

  # 배당 트랩 계열(yield_from_price_drop, payout_excessive, dividend_uncovered)은
  # 켜지 않는다. 고배당을 노리고 산 것이 아니므로 '배당이 끊긴다'가 이 스크린의
  # 위험이 아니다. 성장주가 배당을 안 하는 것은 정상이고, no_dividend 를 켜면
  # 대부분이 걸려 신호가 아니라 소음이 된다.
  - id: high_dividend
    polarity: positive
    enabled: true
    kind: soft_flag
    metric: div_yield
    op: ">="
    threshold: 0.04
    requires_source: dart_alot_matter
    note: 성장주가 배당까지 준다면 드문 조합이라 표기한다(가산 신호)

digest:
  max_risk_groups_for_body: 2

# 랭킹은 **퀄리티 우선**이다. 딥밸류는 싼 순서로 줄을 세우지만, GARP 에서
# PER 최저가 1등이면 결국 딥밸류와 같은 종목을 위로 올리게 된다.
# PER 에 음의 가중을 주되 비중을 낮춰, 밴드 안에서만 저평가를 선호한다.
ranking:
  method: composite_z
  weights: {roe: 0.35, rev_growth_fy: 0.25, op_margin: 0.20, per: -0.20}

soft_flags_report_only:
  - oneoff_profit_suspect
  - per_op_divergence
  - financial_sector
  - holding_company
  - earnings_volatility_high
  - cfs_missing_used_ofs
  - turnaround        # 이 스크린에서는 통과할 수 없지만, 걸리면 설정 오류 신호다
