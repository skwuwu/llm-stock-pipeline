# KR 테마 헌트 — 가설 검증용. **밸류에이션으로 좁히지 않는다.**
#
# 다른 세 스크린은 "싼가 / 잘 크는가 / 현금을 잘 버는가"로 좁힌 뒤 테마를 붙인다.
# 그래서 테마별로 보면 종목이 1~2개뿐이다 — 전력망 4종목, 해외플랜트 1종목.
# "전력망 쇼티지 수혜주를 재무 위험 없이 골라보고 싶다" 같은 **가설**에는
# 그 순서가 거꾸로다. 업종을 먼저 넓게 열고, 테마 배정과 재무 위험을 붙인 뒤,
# 판단은 사람이 한다.
#
# 좁히는 축이 셋뿐이다:
#   1. 업종  — 관심 테마들의 allowed_sectors 합집합
#   2. 규모  — 시총 3,000억+. 테마 대표주를 보려는 것이지 소형주 발굴이 아니다
#   3. 유동성 — 거래대금 3억+. 못 사는 종목을 리스트에 올리면 의미가 없다
#
# ⚠ **이 스크린에는 골든셋 라벨이 없다.** 오분류율을 잴 수 없으므로
#   `golden` 은 거절한다(registry.GOLDEN_LABELS 미등록). 검증 레이어는 그대로
#   돌아 인용 환각은 걸러지지만, 그 정확도가 얼마인지는 측정되지 않은 상태다.
#
# ⚠ **섹터 화이트리스트는 완벽하지 않다.** KIND 업종 매핑이 지주사를
#   '기타 금융업'(OTHER_FIN)으로 보내기 때문에, 제조 지주사(LS 등)는 여기서
#   빠진다. 놓친 수는 매니페스트의 guards.excluded_by.sector_not_in_scope 에 남는다.
version: 2
name: 테마 헌트
market: KR

universe:
  # 관심 테마 13개의 allowed_sectors 합집합. 테마를 추가하면 여기도 넓혀야 한다 —
  # 자동 유도하지 않는 이유는, 유도하면 테마 하나 추가에 유니버스가 조용히
  # 커져 태깅 비용이 예고 없이 늘기 때문이다.
  #   전력      ai_datacenter_power / power_cable_grid / power_semiconductor
  #   에너지     renewable_power_gen / lpg_gas_distribution / nuclear_smr
  #   반도체     memory_semiconductor / semi_materials_parts / hbm_advanced_packaging
  #   플랜트     plant_epc_overseas
  #   해운      shipping_freight
  #   방산      defense_export
  #   냉각      datacenter_cooling
  include_sectors:
    - SEMI
    - ELECTRONIC_COMP
    - ELEC_EQUIP
    - MACHINERY
    - ENERGY
    - UTILITIES
    - CONSTRUCTION
    - STEEL_METAL
    - CHEM
    - NONMETAL_MIN
    - AEROSPACE_DEFENSE
    - AUTO
    - TRANSPORT_LOGISTICS
    - TRADING_DISTRIB
    # v2 추가 — 의료기기·전장 테마를 덮으려면 필요하다.
    #   medical_devices      HEALTHCARE_SVC / PHARMA_BIO / OTHER_MFG
    #   auto_electrification IT_SERVICES
    # 넓히기 전 의료기기 core 는 5종목뿐이었는데, 그건 한국에 의료기기 회사가
    # 없어서가 아니라 **섹터 화이트리스트가 그 업종을 안 열어서**였다.
    # 테마를 추가할 때 allowed_sectors 를 대조하지 않으면 이런 구멍이 생긴다.
    - HEALTHCARE_SVC
    - PHARMA_BIO
    - OTHER_MFG
    - IT_SERVICES

  # 데이터 품질 가드는 다른 스크린과 동일하다. 여기서 느슨하게 하면
  # 주식수 오류(LS에코에너지 30.6조 주) 같은 것이 리스트에 올라온다.
  exclude_flags:
    - capital_impairment
    - stale_financials
    - ttm_incomplete
    - is_spac
    - is_reit
    - is_preferred
    - admin_issue
    - audit_opinion_bad_admin
    - market_cap_implausible
    - pbr_implausible
    - price_dividend_inconsistent
    - market_cap_inconsistent
    # negative_earnings 를 켜지 않는다. 사이클 바닥의 적자 기업이야말로
    # 테마 헌트가 찾아야 할 대상일 수 있고, PER 을 게이트에도 랭킹에도
    # 쓰지 않아 음수 지표가 필터를 뚫는 고장이 발생하지 않는다.
  min_market_cap_krw: 300_000_000_000
  pending_guards:
    - suspended
    - fiscal_period_change

filters:
  # **유동성뿐이다.** 밸류에이션·성장성·수익성 게이트가 없는 것이 이 스크린의 정의다.
  - {metric: adtv_20d, direction: higher_better, loose: 300_000_000, tight: 300_000_000}

gate:
  # rank_top_n: 필터를 가장 느슨한 상태로 두고 랭킹으로 잘라낸다.
  # target_count 이분탐색을 쓰면 유동성 임계가 종목 수에 끌려다닌다 —
  # 여기서는 '거래대금 3억' 이 타협 대상이 아니라 최소 조건이다.
  mode: rank_top_n
  target_count: 450
  hard_cap: 450
  tolerance: 999
  bisect_iterations: 1
  budget:
    enabled: false
    max_input_tokens: 600_000
    est_tokens_per_stock: 8_000
  # 히스테리시스 없음 — 이건 보유 바스켓이 아니라 조사 대상 목록이다.
  hysteresis: 0.0

# 재무 위험 체크는 다른 스크린과 같은 것을 쓴다. **아무것도 배제하지 않고
# 표시만 한다** — 테마 헌트의 목적은 "이 테마에 누가 있나"를 보는 것이고,
# 위험은 그 옆에 붙는 정보이지 입장 조건이 아니다.
checks:
  - id: high_leverage
    polarity: risk
    risk_group: 재무구조
    enabled: true
    kind: soft_flag
    metric: debt_ratio
    op: ">"
    threshold: 2.00
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN, REAL_ESTATE]
    note: 부채비율 200% 초과

  - id: low_current_ratio
    polarity: risk
    risk_group: 재무구조
    enabled: true
    kind: soft_flag
    metric: current_ratio
    op: "<"
    threshold: 1.00
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 유동비율 100% 미만. 결측은 '통과'가 아니라 '계산 불가'로 집계된다

  - id: cfo_shortfall
    polarity: risk
    risk_group: 현금창출
    enabled: true
    kind: soft_flag
    metric: cfo_to_ni
    op: "<"
    threshold: 0.50
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 순이익의 절반도 현금으로 들어오지 않았다

  - id: accrual_anomaly
    polarity: risk
    risk_group: 현금창출
    enabled: true
    kind: soft_flag
    metric: accrual_ratio
    op: ">"
    threshold: 0.10
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 이익이 현금을 앞선다. 발생액 품질 의심

  - id: low_roic
    polarity: risk
    risk_group: 수익성
    enabled: true
    kind: soft_flag
    metric: roic
    op: "<"
    threshold: 0.05
    exclude_sectors: [BANK, INSURANCE, SECURITIES, OTHER_FIN]
    note: 투입자본 대비 수익성이 낮다

  - id: owner_stake_low
    polarity: risk
    risk_group: 지배구조
    enabled: true
    kind: soft_flag
    metric: owner_stake
    op: "<"
    threshold: 0.20
    requires_source: dart_hyslr_sttus
    note: 최대주주 및 특수관계인 합계 20% 미만

  - id: revenue_shrinking
    polarity: risk
    risk_group: 성장지속
    enabled: true
    kind: soft_flag
    metric: rev_growth_fy
    op: "<"
    threshold: -0.05
    note: 매출이 5% 이상 줄었다 — 테마 수혜를 논하기 전에 확인할 것

  - id: treasury_heavy
    polarity: positive
    enabled: true
    kind: soft_flag
    metric: treasury_ratio
    op: ">"
    threshold: 0.05
    exclude_sectors: []
    note: 자사주 5% 초과 보유

digest:
  # 조사 대상 목록이므로 위험이 있어도 본문에서 내리지 않는다. 4 는 실질적으로
  # '내리지 않음'이다(범주가 5개뿐) — 위험은 표에 열로 보인다.
  max_risk_groups_for_body: 4

# **시가총액 순.** 테마 안에서 '상위 기업'을 묻는 질문이므로 규모가 답이다.
# 밸류에이션 가중을 넣는 순간 이 스크린은 딥밸류의 변종이 되고, 그건 이미 있다.
ranking:
  method: composite_z
  weights: {market_cap_used: 1.0}

soft_flags_report_only:
  - oneoff_profit_suspect
  - per_op_divergence
  - financial_sector
  - holding_company
  - negative_earnings
  - turnaround
  - cfs_missing_used_ofs
